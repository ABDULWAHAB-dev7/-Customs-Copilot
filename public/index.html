<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customs Copilot - AI-Powered Customs Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-bar {
            background: #f5f5f5;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #4caf50;
        }

        .status-offline {
            background: #ff9800;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f9f9f9;
        }

        .tab-button {
            flex: 1;
            padding: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .tab-button:hover {
            background: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        button.secondary:hover {
            background: #e0e0e0;
            box-shadow: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-box.error {
            border-left-color: #f44336;
            background: #ffebee;
        }

        .result-box.success {
            border-left-color: #4caf50;
            background: #f1f8f4;
        }

        .result-box.warning {
            border-left-color: #ff9800;
            background: #fff3f0;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .issue-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #ff9800;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .copy-button {
            background: #4caf50;
        }

        .copy-button:hover {
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Customs Copilot</h1>
            <p>AI-Powered Customs Clearance Assistant</p>
        </header>

        <div class="status-bar">
            <div>
                <span class="status-indicator status-online" id="statusIndicator"></span>
                <span id="statusText">Loading...</span>
            </div>
            <div id="modeText"></div>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('query')">📝 Query Reply</button>
            <button class="tab-button" onclick="switchTab('charges')">💰 Charge Checker</button>
        </div>

        <!-- Query Reply Tab -->
        <div id="query" class="tab-content active">
            <h2>Draft Response to Customs Query</h2>
            <p style="margin: 20px 0; color: #666;">Ask a question about your shipment and get a cited response based on customs documentation.</p>

            <div class="form-group">
                <label for="shipmentId">Shipment ID</label>
                <input type="text" id="shipmentId" placeholder="e.g., SHIP-001" />
            </div>

            <div class="form-group">
                <label for="query">Your Question</label>
                <textarea id="query" placeholder="e.g., What documents are required for this import?"></textarea>
            </div>

            <div class="form-group">
                <label for="documents">Documents (JSON)</label>
                <textarea id="documents" placeholder='[{"name": "invoice.pdf", "content": "..."}]' style="min-height: 100px;"></textarea>
            </div>

            <div class="button-group">
                <button onclick="processQuery()">Generate Response</button>
                <button class="secondary" onclick="clearQueryForm()">Clear</button>
            </div>

            <div id="queryResult" class="result-box"></div>
        </div>

        <!-- Charge Checker Tab -->
        <div id="charges" class="tab-content">
            <h2>Check Invoice Charges</h2>
            <p style="margin: 20px 0; color: #666;">Validate charges against tariff rates and flag discrepancies.</p>

            <div class="form-group">
                <label for="invoiceId">Invoice ID</label>
                <input type="text" id="invoiceId" placeholder="e.g., INV-001" />
            </div>

            <div class="form-group">
                <label for="port">Port/CFS</label>
                <input type="text" id="port" placeholder="e.g., INMAA4" />
            </div>

            <div class="form-group">
                <label for="chargesJson">Charges (JSON)</label>
                <textarea id="chargesJson" placeholder='[{"description": "Port handling", "tariff_ref": "PH001", "amount": 1000, "gst": 180}]' style="min-height: 120px;"></textarea>
            </div>

            <div class="button-group">
                <button onclick="checkCharges()">Validate Charges</button>
                <button class="secondary" onclick="clearChargesForm()">Clear</button>
            </div>

            <div id="chargesResult" class="result-box"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            checkSystemStatus();
        });

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function checkSystemStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();

                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const modeText = document.getElementById('modeText');

                indicator.className = 'status-indicator status-online';
                statusText.textContent = `System: ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}`;
                modeText.textContent = `Mode: ${data.llm_mode === 'enabled' ? 'AI-Powered' : 'Offline Mode'}`;

            } catch (error) {
                document.getElementById('statusIndicator').className = 'status-indicator status-offline';
                document.getElementById('statusText').textContent = 'System: Offline Mode (local processing)';
                document.getElementById('modeText').textContent = '';
            }
        }

        async function processQuery() {
            const shipmentId = document.getElementById('shipmentId').value;
            const query = document.getElementById('query').value;
            const documentsText = document.getElementById('documents').value;
            const resultBox = document.getElementById('queryResult');

            if (!query) {
                showResult(resultBox, 'Please enter a question', 'error');
                return;
            }

            let documents = [];
            if (documentsText) {
                try {
                    documents = JSON.parse(documentsText);
                } catch (e) {
                    showResult(resultBox, 'Invalid JSON in documents field', 'error');
                    return;
                }
            }

            showResult(resultBox, '<span class="loading"></span> Processing query...', 'success');

            try {
                const response = await fetch(`${API_BASE}/query-reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query,
                        shipment_id: shipmentId,
                        documents
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showResult(resultBox, `Error: ${data.error}`, 'error');
                    return;
                }

                let resultHtml = '<div class="result-title">📄 Draft Response:</div>';
                resultHtml += `<p style="white-space: pre-wrap; margin: 15px 0;">${escapeHtml(data.draft_response)}</p>`;

                resultHtml += '<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">';
                resultHtml += '<strong>✓ Verification Status:</strong><br/>';
                resultHtml += `• Documents Valid: ${data.verification.documents_valid ? '✓' : '✗'}<br/>`;
                resultHtml += `• Citations Valid: ${data.verification.citations_valid ? '✓' : '✗'}<br/>`;
                resultHtml += `• Ready for Approval: ${data.ready_for_approval ? '✓ Yes' : '✗ No'}<br/>`;

                if (data.verification.missing_documents.length > 0) {
                    resultHtml += `<br/>Missing Documents: ${data.verification.missing_documents.join(', ')}`;
                }
                resultHtml += '</div>';

                if (data.ready_for_approval) {
                    resultHtml += '<div class="button-group" style="margin-top: 20px;"><button class="copy-button" onclick="copyToClipboard(this)">📋 Copy Response</button></div>';
                }

                showResult(resultBox, resultHtml, 'success');

            } catch (error) {
                showResult(resultBox, `Error: ${error.message}`, 'error');
            }
        }

        async function checkCharges() {
            const invoiceId = document.getElementById('invoiceId').value;
            const port = document.getElementById('port').value;
            const chargesText = document.getElementById('chargesJson').value;
            const resultBox = document.getElementById('chargesResult');

            if (!chargesText) {
                showResult(resultBox, 'Please enter charge details', 'error');
                return;
            }

            let charges = [];
            try {
                charges = JSON.parse(chargesText);
            } catch (e) {
                showResult(resultBox, 'Invalid JSON in charges field', 'error');
                return;
            }

            showResult(resultBox, '<span class="loading"></span> Validating charges...', 'success');

            try {
                const response = await fetch(`${API_BASE}/check-charges`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: invoiceId,
                        port,
                        charges
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showResult(resultBox, `Error: ${data.error}`, 'error');
                    return;
                }

                let resultHtml = `<div class="result-title">💰 Charge Validation Result</div>`;
                resultHtml += `<p><strong>Status:</strong> ${data.status}</p>`;
                resultHtml += `<p><strong>Total Variance:</strong> ₹${data.total_variance.toFixed(2)}</p>`;

                if (data.issues.length > 0) {
                    resultHtml += `<p><strong style="color: #ff9800;">⚠️ ${data.issues.length} Issue(s) Found:</strong></p>`;
                    data.issues.forEach(issue => {
                        resultHtml += `
                            <div class="issue-item">
                                <strong>${issue.type.replace(/_/g, ' ').toUpperCase()}</strong><br/>
                                Charge: ${issue.charge}<br/>
                                Billed: ₹${issue.billed.toFixed(2)} | Expected: ₹${issue.expected.toFixed(2)}<br/>
                                Tariff Ref: ${issue.tariff_ref}<br/>
                                Message: ${issue.message}
                            </div>
                        `;
                    });
                } else {
                    resultHtml += '<p style="color: #4caf50;"><strong>✓ All charges are valid!</strong></p>';
                }

                showResult(resultBox, resultHtml, data.issues.length > 0 ? 'warning' : 'success');

            } catch (error) {
                showResult(resultBox, `Error: ${error.message}`, 'error');
            }
        }

        function showResult(box, content, type) {
            box.innerHTML = content;
            box.className = `result-box show ${type}`;
            box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyToClipboard(button) {
            const text = button.closest('.result-box').innerText.replace('📋 Copy Response', '').trim();
            navigator.clipboard.writeText(text).then(() => {
                button.textContent = '✓ Copied!';
                setTimeout(() => { button.textContent = '📋 Copy Response'; }, 2000);
            });
        }

        function clearQueryForm() {
            document.getElementById('shipmentId').value = '';
            document.getElementById('query').value = '';
            document.getElementById('documents').value = '';
            document.getElementById('queryResult').className = 'result-box';
        }

        function clearChargesForm() {
            document.getElementById('invoiceId').value = '';
            document.getElementById('port').value = '';
            document.getElementById('chargesJson').value = '';
            document.getElementById('chargesResult').className = 'result-box';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
